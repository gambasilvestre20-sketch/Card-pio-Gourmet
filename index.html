
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Geladinho das Meninas 💗</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;

      background: linear-gradient(
        135deg,
        #ffb6d9 0%,
        #f08bd2 35%,
        #c084fc 70%,
        #8b5cf6 100%
      );

      font-family: 'Poppins', sans-serif;
    }

    .conteudo {
      text-align: center;
      max-width: 600px;
      animation: aparecer 1.2s ease both;
    }

    .decoracao {
      font-size: 2.5rem;
      margin-bottom: 20px;
      filter: drop-shadow(0 5px 10px #782b8140);
    }

    h1 {
      color: white;
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.8rem, 10vw, 5rem);
      font-weight: 400;
      line-height: 1.3;
      text-shadow: 0 5px 18px #702b8b55;
    }

    .linha {
      width: 90px;
      height: 4px;
      margin: 24px auto;
      border-radius: 10px;
      background: linear-gradient(
        90deg,
        #ffffff80,
        #ffffff,
        #ffffff80
      );
    }

    .slogan {
      color: white;
      font-size: clamp(1rem, 4vw, 1.25rem);
      font-weight: 400;
      line-height: 1.8;
      text-shadow: 0 2px 10px #702b8b40;
    }

    .coracao {
      display: inline-block;
      margin-top: 25px;
      color: white;
      font-size: 1.5rem;
      animation: pulsar 1.5s infinite ease-in-out;
    }

    .brilho {
      position: fixed;
      color: #ffffff70;
      font-size: 1.5rem;
      pointer-events: none;
    }

    .brilho.um {
      top: 15%;
      left: 12%;
    }

    .brilho.dois {
      top: 25%;
      right: 12%;
      font-size: 2rem;
    }

    .brilho.tres {
      bottom: 17%;
      left: 18%;
      font-size: 2rem;
    }

    .brilho.quatro {
      bottom: 22%;
      right: 15%;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulsar {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }
    }
  </style>
</head>

<body>

  <span class="brilho um">✦</span>
  <span class="brilho dois">✧</span>
  <span class="brilho tres">✦</span>
  <span class="brilho quatro">✧</span>

  <main class="conteudo">

    <div class="decoracao">🍓 ❄️ 🍇</div>

    <h1>Geladinho<br>das Meninas</h1>

    <div class="linha"></div>

    <p class="slogan">
      Um pedacinho de felicidade<br>
      pra refrescar seu dia! 💗
    </p>

    <span class="coracao">♡</span>

  </main>

</body>
</html>
